name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Make the Xcode project
        run: xcodegen generate

      - name: Build the app
        run: |
          xcodebuild -project MagicBall.xcodeproj \
            -scheme MagicBall \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Make the IPA file
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MagicBall.app Payload/
          zip -r MagicBall.ipa Payload

      - name: Save the IPA
        uses: actions/upload-artifact@v4
        with:
          name: MagicBall-ipa
          path: MagicBall.ipa
